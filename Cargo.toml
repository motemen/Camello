[package]
name = "camello"
version = "0.1.0"
edition = "2021"

[dependencies]
# CST操作のコアライブラリ
rowan = "0.15"

# 高性能字句解析
logos = "0.14"

# CLI構築
clap = { version = "4.0", features = ["derive"] }

# 効率的な文字列処理
smol_str = "0.2"

# 桁揃えのための表示幅（全角は2桁）
unicode-width = "0.2"

# エラー診断とレポート
miette = { version = "7.0", features = ["fancy"] }
thiserror = "1.0"

# Character encoding conversion
encoding_rs = "0.8"
mimalloc = "0.1.52"

[dev-dependencies]
# スナップショットテスト
insta = "1.0"

# テスト用の一時ファイル作成
tempfile = "3.0"

# Release, plus the symbols a profiler needs to name a frame.
#
#   cargo build --profile profiling
#   samply record ./target/profiling/camello format --check -j1 <path>
[profile.profiling]
inherits = "release"
debug = true
