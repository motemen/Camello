[package]
name = "camello"
version = "0.1.0"
edition = "2021"

[features]
# The allocator is the only C dependency, and the whole of what a Linux build
# needs a C toolchain for. Off by default so the binary cross-compiles from a
# Mac with nothing beyond rustup; on when the run is large enough to notice the
# fifth of the time it saves — see the commit that introduced it.
#
#   cargo build --release --features mimalloc
mimalloc = ["dep:mimalloc"]

[dependencies]
# CST操作のコアライブラリ
rowan = "0.15"

# CLI構築
clap = { version = "4.0", features = ["derive"] }

# 効率的な文字列処理
smol_str = "0.2"

# 桁揃えのための表示幅（全角は2桁）
unicode-width = "0.2"

# エラー診断とレポート
miette = { version = "7.0", features = ["fancy"] }
thiserror = "1.0"

# Character encoding conversion
encoding_rs = "0.8"
mimalloc = { version = "0.1.52", optional = true }

[dev-dependencies]
# スナップショットテスト
insta = "1.0"

# テスト用の一時ファイル作成
tempfile = "3.0"

# Release, plus the symbols a profiler needs to name a frame.
#
#   cargo build --profile profiling
#   samply record ./target/profiling/camello format --check -j1 <path>
[profile.profiling]
inherits = "release"
debug = true
