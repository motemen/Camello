[workspace]
members = ["crates/camello-syntax", "crates/camello-fmt", "crates/camello-sema"]
# The root package is a member too, and cargo would otherwise take it alone as
# the default — `cargo test -q`, which is the sequence docs/architecture.md
# asks for before pushing, has to mean the whole workspace.
default-members = [
    ".",
    "crates/camello-syntax",
    "crates/camello-fmt",
    "crates/camello-sema",
]

# The split of `docs/typecheck.md` ("Where it lives"): the checker must not be
# able to reach the formatter's Doc IR, and Cargo is what enforces the direction
# rather than review.
[workspace.package]
version = "0.1.1"
edition = "2021"

[workspace.dependencies]
rowan = "0.15"
smol_str = "0.2"
unicode-width = "0.2"
miette = { version = "7.0", features = ["fancy"] }
thiserror = "1.0"
insta = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package]
name = "camello"
version.workspace = true
edition.workspace = true

[features]
# The allocator is the only C dependency, and the whole of what a Linux build
# needs a C toolchain for. Off by default so the binary cross-compiles from a
# Mac with nothing beyond rustup; on when the run is large enough to notice the
# fifth of the time it saves — see the commit that introduced it.
#
#   cargo build --release --features mimalloc
mimalloc = ["dep:mimalloc"]

[dependencies]
camello-syntax = { path = "crates/camello-syntax" }
camello-fmt = { path = "crates/camello-fmt" }
camello-sema = { path = "crates/camello-sema" }

# CST操作のコアライブラリ
rowan = { workspace = true }

# CLI構築
clap = { version = "4.0", features = ["derive"] }

# 桁揃えのための表示幅（全角は2桁）
unicode-width = { workspace = true }

# How wide the progress line may be before the terminal wraps it
terminal_size = "0.4"

# Whether the terminal reading a divergence would read colour in it
supports-color = "3.0"

# エラー診断とレポート
miette = { workspace = true }
thiserror = { workspace = true }

# Character encoding conversion
encoding_rs = "0.8"

# camello.toml, and --format json (docs/typecheck.md, milestone 6)
toml = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
mimalloc = { version = "0.1.52", optional = true }

[dev-dependencies]
# スナップショットテスト
insta = { workspace = true }

# テスト用の一時ファイル作成
tempfile = "3.0"

# Release, plus the symbols a profiler needs to name a frame.
#
#   cargo build --profile profiling
#   samply record ./target/profiling/camello format --check -j1 <path>
[profile.profiling]
inherits = "release"
debug = true
