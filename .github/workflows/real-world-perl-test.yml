name: Real-world Perl Code Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  pull-requests: write

jobs:
  test-real-world-perl:
    runs-on: ubuntu-latest
    name: Test Camello with Real-world Perl Code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test multiple Perl files
        id: test
        run: |
          declare -A TEST_CASES=(
            ["Menlo::Dependency"]="https://raw.githubusercontent.com/miyagawa/cpanminus/devel/Menlo/lib/Menlo/Dependency.pm"
          )

          # Initialize result files
          : > all_results.md

          echo "## 🔍 Real-world Perl Code Test Results" >> all_results.md
          echo "" >> all_results.md

          # Process each test case
          for name in "${!TEST_CASES[@]}"; do
            url="${TEST_CASES[$name]}"
            echo "Testing: $name"
            echo "URL: $url"
            
            echo "### 📄 $name" >> all_results.md
            echo "**Source:** $url" >> all_results.md
            echo "" >> all_results.md
            
            # Run curl | diff and capture both stdout and stderr separately
            curl -sf "$url" | ./scripts/diff - > "stdout_$name.txt" 2> "stderr_$name.txt" || :

            echo "#### 📝 Formatting Differences" >> all_results.md
            echo '```diff' >> all_results.md
            cat "stdout_$name.txt" >> all_results.md
            echo '```' >> all_results.md
            
            # Show stderr if any (warnings, parse errors, etc.)
            if [ -s "stderr_$name.txt" ]; then
              echo "#### ⚠️ Warnings/Parse Errors" >> all_results.md
              echo '```' >> all_results.md
              cat "stderr_$name.txt" >> all_results.md
              echo '```' >> all_results.md
            fi
            
            echo "" >> all_results.md
            echo "---" >> all_results.md
            echo "" >> all_results.md
            
            # Clean up temp files
            rm -f "stdout_$name.txt" "stderr_$name.txt"
          done

          echo "*This test helps ensure Camello works correctly with real-world Perl code.*" >> all_results.md

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        if: always()
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '🔍 Real-world Perl Code Test Results'
      
      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        if: always()
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: all_results.md
          edit-mode: replace
