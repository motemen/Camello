name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# The toolchain is rust-toolchain.toml's, components included: `rustup toolchain
# install` with no argument installs the one that file names, so the version is
# written down once.

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is half of the release targets.
        os: [ ubuntu-latest, macos-latest ]
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install the toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Run tests
      run: cargo test --workspace --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install the toolchain
      run: rustup toolchain install
    - name: Enforce formatting
      run: cargo fmt --all --check

  # Also what `cargo check` would say: clippy type-checks every target first.
  # `--all-features` brings in `mimalloc`, which no default build compiles.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install the toolchain
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Linting
      run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
