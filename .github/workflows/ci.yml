name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.91.0
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Check
      run: cargo check --workspace --all-targets

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.91.0
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Run tests
      run: cargo test --workspace

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.91.0
        components: rustfmt
    - name: Enforce formatting
      run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: 1.91.0
        components: clippy
    - uses: Swatinem/rust-cache@v2.9.3
    - name: Linting
      run: cargo clippy --workspace --all-targets -- -D warnings
