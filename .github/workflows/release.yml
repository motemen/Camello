name: Release

# A `v*` tag is the release. Every other tag in this repository — the `wip`
# ones — is a bookmark and must not build anything.
on:
  push:
    tags: [ 'v*' ]
  # The same build, without publishing, to prove the matrix still works before
  # a tag depends on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The version lives in one place (Cargo.toml's [workspace.package]); the tag
  # has to agree with it, and the release notes are the CHANGELOG section for
  # it. Both are settled before anything is built.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Resolve the version
      id: version
      run: |
        crate=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
                | sed -n 's/^version = "\(.*\)"/\1/p')
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          version=${GITHUB_REF_NAME#v}
          if [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with Cargo.toml version $crate"
            exit 1
          fi
        else
          version=$crate
        fi
        echo "version=$version" >>"$GITHUB_OUTPUT"

    - name: Cut the release notes out of the CHANGELOG
      run: |
        awk -v ver="${{ steps.version.outputs.version }}" '
          /^## / { found = ($2 == ver); next }
          found { print }
        ' CHANGELOG.md >notes.md
        # An entry is not required — a tag may come before one is written — but
        # an empty file would publish a release with no body at all.
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "No CHANGELOG entry for ${{ steps.version.outputs.version }}." >notes.md
        fi
        cat notes.md

    - uses: actions/upload-artifact@v7.0.2
      with:
        name: notes
        path: notes.md

  build:
    name: Build
    needs: prepare
    # The ceiling for what release-build.yml may ask for: signing needs an OIDC
    # token and the right to store what it signs, and nothing here writes to
    # the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    name: Publish
    # One release, made after every target has built: a target that fails
    # leaves no half-published release behind.
    needs: [ prepare, build ]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        path: artifacts

    # Releases are immutable: once published, neither the assets nor the tag
    # can change. `gh release create` uploads into a draft and publishes it last,
    # so the release is sealed with every asset already in it.
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p upload
        find artifacts -type f \( -name '*.tar.gz*' -o -name '*.vsix' \) \
          -exec mv {} upload/ \;
        ls -l upload
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$GITHUB_REF_NAME" \
          --notes-file artifacts/notes/notes.md \
          --verify-tag \
          upload/*
