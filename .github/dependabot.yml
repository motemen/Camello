# Every action a workflow runs, and every action those run in turn, is locked
# to a commit in .github/workflows/actions.lock, so nothing moves under a
# workflow until a pull request here says it should. A bump rewrites the
# workflow's tag and its lockfile entry together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
